name: LONLY CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Acceptance, Security Gate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Code Quality & Linting
        run: |
          make lint

      - name: Run Automated CI Security Gate
        run: |
          python eval/ci_security_gate.py

      - name: Run Consolidated 172-Check Acceptance Suite
        run: |
          python eval/eval_lonly.py 2>&1 | tee eval.log
          cat eval.log >> "$GITHUB_STEP_SUMMARY"
