[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lonly"
version = "2.0.0"
description = "Logically Optimized Network Logistics & Intelligence — Autonomous Pentest Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LONLY Core Team"}
]
dependencies = [
    "langchain>=1.4.0,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-chroma>=1.1.0,<2.0.0",
    "chromadb>=1.5.0",
    "networkx>=3.4.0",
    "pydantic>=2.10.0,<3.0.0",
    "requests>=2.32.0",
    "impacket>=0.13.0",
    "sqlmap>=1.10.0",
]

[project.optional-dependencies]
sft = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "trl>=0.9.0",
    "unsloth",
    "safetensors>=0.4.0",
]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "runs",
    "chroma_db",
    ".lonly",
    "build",
    "dist",
    "models/sft",
    ".agents",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "E741",  # Ambiguous variable name
    "F401",  # Unused imports (cleanly separated at package levels)
    "F541",  # f-string without placeholders
    "F841",  # Local variable is assigned to but never used
    "W291",  # Trailing whitespace
    "W292",  # No newline at end of file
    "W293",  # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["F401", "F811"]  # Imports and mock overrides in test files
"tools/*" = ["F401"]
"core/*" = ["F401"]
